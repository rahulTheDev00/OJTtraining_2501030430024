<!DOCTYPE html>
<html>
<head>
  <title>Nested Lists</title>
</head>
<body>

  <h2>Ordered List with Nested Unordered List</h2>

  <ol>
    <li>Fruits
      <ul>
        <li>Apple</li>
        <li>Banana</li>
        <li>Mango</li>
      </ul>
    </li>

    <li>Vegetables
      <ul>
        <li>Carrot</li>
        <li>Potato</li>
      </ul>
    </li>
  </ol>

</body>
</html>
